<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Weather Application</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-LN+7fdVzj6u52u30Kp6M/trliBMCMKTyK833zpbD+pXdCLuTusPj697FH4R/5mcr"
      crossorigin="anonymous"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
      integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container text-center">
      <h1 class="mt-4 display-6 fw-bold text-white">Weather js</h1>
      <p class="fst-italic text-white fw-bold">Your direct line to the sky</p>

      <div class="weather-container mx-auto shadow col-md-8">
        <div class="input-group mb-3">
          <input
            type="text"
            id="input-box"
            class="form-control"
            placeholder="Enter city name"
            autocomplete="off"
          />
          <button type="button" id="button" class="btn btn-outline-secondary">
            <i class="fa-solid fa-magnifying-glass"></i>
          </button>
        </div>
        <div id="error-message" class="alert alert-danger d-none" role="alert">
          city not found , please enter a valid city name.
        </div>
        <div class="weather-body" id="weather-body">
            <div class="mb-3">
                <h3 id="city">Bhopal, IN</h3>
                <p id="date">Monday,9 June , 2025</p>
                <div class="mb-3">
                    <h3 id="temp">30'C</h3>
                    <p id="min-max">30'C(Min)/32'C(max)</p>
                    <p id="weather">Clear</p>
                </div> 
                <div class="row text-center">
                    <div class="col-md-4">
                        <div class="card info-card">
                            <div class="card-body">
                            <img src="media/images/humidity.jpg" alt="">
                            <p class="mt-2" id="humidity">41%</p>
                            </div>
                        </div>
                    </div>
                        <div class="col-md-4">
                        <div class="card info-card">
                            <div class="card-body">
                            <img src="media/images/windicon.jpg" alt="">
                            <p class="mt-2" id="wind">41%</p>
                            </div>
                        </div>
                    </div>
                        <div class="col-md-4">
                        <div class="card info-card">
                            <div class="card-body">
                            <img src="media/images/temp.jpg" alt="">
                            <p class="mt-2" id="presure">41%</p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
      </div>
    </div>
    <script src="script.js"></script>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-ndDqU0Gzau9qJ1lfW4pNLlhNTkCfHzAVBReH9diLvGRem5+R9g2FzA8ZGN954O5Q"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
